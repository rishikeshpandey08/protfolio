<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="50%" stop-color="#151828"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad-1)"/>
  
  <!-- Glowing Background Orbs -->
  <circle cx="200" cy="150" r="140" fill="#7c5cff" opacity="0.25" filter="url(#blur-1)"/>
  <circle cx="650" cy="350" r="120" fill="#00f0ff" opacity="0.2" filter="url(#blur-1)"/>

  <!-- Subtle Grid -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Window Container -->
  <g transform="translate(60, 45)">
    <!-- Window Outer Glass Frame -->
    <rect width="680" height="410" rx="16" fill="#121522" fill-opacity="0.85" stroke="#2a3048" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="680" height="42" rx="16" fill="#181c2e" fill-opacity="0.9"/>
    <circle cx="24" cy="21" r="5.5" fill="#ff5f56"/>
    <circle cx="44" cy="21" r="5.5" fill="#ffbd2e"/>
    <circle cx="64" cy="21" r="5.5" fill="#27c93f"/>
    <text x="340" y="26" fill="#8e9bb5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">DevPulse AI — Autonomous PR Review &amp; Security Analysis</text>

    <!-- Sidebar -->
    <rect x="0" y="42" width="160" height="368" fill="#101320" fill-opacity="0.6"/>
    <line x1="160" y1="42" x2="160" y2="410" stroke="#22283e"/>

    <!-- Sidebar Items -->
    <rect x="15" y="65" width="130" height="28" rx="6" fill="#7c5cff" fill-opacity="0.2" stroke="#7c5cff" stroke-width="1"/>
    <circle cx="30" cy="79" r="4" fill="#00f0ff"/>
    <text x="45" y="83" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Active Review</text>

    <rect x="15" y="105" width="130" height="24" rx="6" fill="transparent"/>
    <circle cx="30" cy="117" r="4" fill="#657291"/>
    <text x="45" y="121" fill="#8e9bb5" font-family="system-ui, sans-serif" font-size="11">Security Vulnerabilities</text>

    <rect x="15" y="140" width="130" height="24" rx="6" fill="transparent"/>
    <circle cx="30" cy="152" r="4" fill="#657291"/>
    <text x="45" y="156" fill="#8e9bb5" font-family="system-ui, sans-serif" font-size="11">Latency Profiler</text>

    <rect x="15" y="175" width="130" height="24" rx="6" fill="transparent"/>
    <circle cx="30" cy="187" r="4" fill="#657291"/>
    <text x="45" y="191" fill="#8e9bb5" font-family="system-ui, sans-serif" font-size="11">Model Config</text>

    <!-- Main Content Area -->
    <!-- Metric Badges -->
    <g transform="translate(180, 60)">
      <rect width="145" height="65" rx="10" fill="#181c2e" stroke="#2a3048"/>
      <text x="16" y="26" fill="#8e9bb5" font-family="system-ui, sans-serif" font-size="11">Code Quality Score</text>
      <text x="16" y="52" fill="#00f0ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">98.4<tspan font-size="12" fill="#8e9bb5">/100</tspan></text>

      <rect x="160" y="0" width="145" height="65" rx="10" fill="#181c2e" stroke="#2a3048"/>
      <text x="176" y="26" fill="#8e9bb5" font-family="system-ui, sans-serif" font-size="11">Vulnerabilities</text>
      <text x="176" y="52" fill="#27c93f" font-family="system-ui, sans-serif" font-size="20" font-weight="700">0 High <tspan font-size="11" fill="#8e9bb5">✓</tspan></text>

      <rect x="320" y="0" width="155" height="65" rx="10" fill="#181c2e" stroke="#2a3048"/>
      <text x="336" y="26" fill="#8e9bb5" font-family="system-ui, sans-serif" font-size="11">Review Latency</text>
      <text x="336" y="52" fill="#7c5cff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">1.2s <tspan font-size="11" fill="#8e9bb5">AI Engine</tspan></text>
    </g>

    <!-- Code Block / Diff Viewer -->
    <g transform="translate(180, 140)">
      <rect width="475" height="240" rx="10" fill="#0d0f18" stroke="#252b42"/>
      
      <!-- Code lines -->
      <text x="20" y="32" fill="#7c5cff" font-family="monospace" font-size="11">import</text>
      <text x="70" y="32" fill="#e2e8f0" font-family="monospace" font-size="11">{ analyzeAST, optimizeBundle } from</text>
      <text x="315" y="32" fill="#00f0ff" font-family="monospace" font-size="11">'@devpulse/engine'</text>

      <rect x="12" y="48" width="451" height="26" fill="#ff3366" fill-opacity="0.12" rx="4"/>
      <text x="20" y="65" fill="#ff5f56" font-family="monospace" font-size="11">- const cache = new Map(); // Potential unbounded memory leak</text>

      <rect x="12" y="78" width="451" height="26" fill="#27c93f" fill-opacity="0.12" rx="4"/>
      <text x="20" y="95" fill="#27c93f" font-family="monospace" font-size="11">+ const cache = new LRUCache({ max: 500, ttl: 1000 * 60 });</text>

      <text x="20" y="130" fill="#8e9bb5" font-family="monospace" font-size="11">export async function processPullRequest(payload: PRPayload) {</text>
      <text x="40" y="152" fill="#8e9bb5" font-family="monospace" font-size="11">const insight = await analyzeAST(payload.diff, { strictMode: true });</text>
      <text x="40" y="174" fill="#00f0ff" font-family="monospace" font-size="11">return generateSummaryReport(insight);</text>
      <text x="20" y="196" fill="#8e9bb5" font-family="monospace" font-size="11">}</text>

      <!-- AI Floating Insight Tag -->
      <g transform="translate(230, 160)">
        <rect width="230" height="65" rx="8" fill="#181d2f" stroke="#7c5cff" stroke-width="1.2"/>
        <text x="14" y="24" fill="#00f0ff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚡ AI Auto-Fix Applied</text>
        <text x="14" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Memory footprint reduced by 42%</text>
      </g>
    </g>

  </g>
</svg>
