<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="50%" stop-color="#111728"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="chart-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="chart-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="blur-2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad-2)"/>
  
  <!-- Glowing Background Orbs -->
  <circle cx="650" cy="180" r="140" fill="#00f0ff" opacity="0.18" filter="url(#blur-2)"/>
  <circle cx="180" cy="380" r="130" fill="#7c5cff" opacity="0.22" filter="url(#blur-2)"/>

  <!-- Glass Container -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="#121626" fill-opacity="0.9" stroke="#252c46" stroke-width="1.5"/>
    
    <!-- Header bar -->
    <rect width="680" height="44" rx="16" fill="#171c30" fill-opacity="0.95"/>
    <circle cx="24" cy="22" r="5.5" fill="#ff5f56"/>
    <circle cx="44" cy="22" r="5.5" fill="#ffbd2e"/>
    <circle cx="64" cy="22" r="5.5" fill="#27c93f"/>
    <text x="340" y="27" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CloudZen OS — Real-time Distributed Cluster &amp; Telemetry Stream</text>

    <!-- Cluster Status Cards -->
    <g transform="translate(25, 60)">
      <rect width="145" height="75" rx="10" fill="#161b2e" stroke="#262e49"/>
      <text x="14" y="24" fill="#8e9bb5" font-family="system-ui, sans-serif" font-size="11">Active Nodes</text>
      <text x="14" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">48 / 48</text>
      <text x="14" y="68" fill="#27c93f" font-family="system-ui, sans-serif" font-size="10">● All Healthy</text>

      <rect x="160" y="0" width="145" height="75" rx="10" fill="#161b2e" stroke="#262e49"/>
      <text x="174" y="24" fill="#8e9bb5" font-family="system-ui, sans-serif" font-size="11">Throughput</text>
      <text x="174" y="52" fill="#00f0ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">2.4M <tspan font-size="12" fill="#8e9bb5">req/s</tspan></text>
      <text x="174" y="68" fill="#00f0ff" font-family="system-ui, sans-serif" font-size="10">▲ +14% peak</text>

      <rect x="320" y="0" width="145" height="75" rx="10" fill="#161b2e" stroke="#262e49"/>
      <text x="334" y="24" fill="#8e9bb5" font-family="system-ui, sans-serif" font-size="11">Avg Latency</text>
      <text x="334" y="52" fill="#7c5cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">14.2 <tspan font-size="12" fill="#8e9bb5">ms</tspan></text>
      <text x="334" y="68" fill="#27c93f" font-family="system-ui, sans-serif" font-size="10">p99: 28ms</text>

      <rect x="480" y="0" width="150" height="75" rx="10" fill="#161b2e" stroke="#262e49"/>
      <text x="494" y="24" fill="#8e9bb5" font-family="system-ui, sans-serif" font-size="11">Memory Saturation</text>
      <text x="494" y="52" fill="#ffbd2e" font-family="system-ui, sans-serif" font-size="22" font-weight="700">62.8%</text>
      <text x="494" y="68" fill="#8e9bb5" font-family="system-ui, sans-serif" font-size="10">Auto-scaling OK</text>
    </g>

    <!-- Main Chart Area -->
    <g transform="translate(25, 150)">
      <rect width="400" height="235" rx="10" fill="#101322" stroke="#232942"/>
      <text x="18" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Real-Time WebSocket Traffic Stream (QPS)</text>

      <!-- Chart Grid Lines -->
      <line x1="20" y1="60" x2="380" y2="60" stroke="#1f253d" stroke-dasharray="3 3"/>
      <line x1="20" y1="110" x2="380" y2="110" stroke="#1f253d" stroke-dasharray="3 3"/>
      <line x1="20" y1="160" x2="380" y2="160" stroke="#1f253d" stroke-dasharray="3 3"/>
      <line x1="20" y1="205" x2="380" y2="205" stroke="#2a3250"/>

      <!-- Chart Waves -->
      <!-- Purple Area -->
      <path d="M 20 180 Q 80 130, 140 150 T 260 110 T 380 90 L 380 205 L 20 205 Z" fill="url(#chart-grad-2)"/>
      <path d="M 20 180 Q 80 130, 140 150 T 260 110 T 380 90" fill="none" stroke="#7c5cff" stroke-width="2.5"/>

      <!-- Cyan Area -->
      <path d="M 20 195 Q 90 160, 160 140 T 290 80 T 380 65 L 380 205 L 20 205 Z" fill="url(#chart-grad-1)"/>
      <path d="M 20 195 Q 90 160, 160 140 T 290 80 T 380 65" fill="none" stroke="#00f0ff" stroke-width="2.5"/>

      <!-- Chart Point Dot -->
      <circle cx="290" cy="80" r="5" fill="#ffffff" stroke="#00f0ff" stroke-width="3"/>
    </g>

    <!-- Side Microservices Topology -->
    <g transform="translate(440, 150)">
      <rect width="215" height="235" rx="10" fill="#101322" stroke="#232942"/>
      <text x="16" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Service Mesh Nodes</text>

      <!-- Mini Nodes -->
      <rect x="16" y="45" width="183" height="38" rx="6" fill="#181e33" stroke="#2b3454"/>
      <circle cx="32" cy="64" r="5" fill="#27c93f"/>
      <text x="46" y="61" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">auth-service:v2</text>
      <text x="46" y="74" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">12 replicas • 0.8ms</text>

      <rect x="16" y="93" width="183" height="38" rx="6" fill="#181e33" stroke="#2b3454"/>
      <circle cx="32" cy="112" r="5" fill="#00f0ff"/>
      <text x="46" y="109" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">telemetry-broker</text>
      <text x="46" y="122" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">24 replicas • Kafka</text>

      <rect x="16" y="141" width="183" height="38" rx="6" fill="#181e33" stroke="#2b3454"/>
      <circle cx="32" cy="160" r="5" fill="#7c5cff"/>
      <text x="46" y="157" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">inference-gateway</text>
      <text x="46" y="170" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">8 replicas • GPU cluster</text>

      <rect x="16" y="189" width="183" height="34" rx="6" fill="#7c5cff" fill-opacity="0.15" stroke="#7c5cff" stroke-width="1"/>
      <text x="107" y="211" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">View Telemetry Stream →</text>
    </g>

  </g>
</svg>
